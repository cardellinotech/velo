services:
  postgres:
    image: postgres:17-alpine
    env_file: .env.docker
    volumes:
      - velo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - velo_node_modules:/app/node_modules
    env_file: .env.docker
    command: sh -c "npm install && npx drizzle-kit push"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - velo_node_modules:/app/node_modules
    env_file: .env.docker
    command: npm run dev
    ports:
      - "3003:3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  velo_pgdata:
  velo_node_modules:
